site_name: agency-rules
site_author: Deuri Vasquez
site_url: https://deuriib.github.io/agency-rules/
site_description: Write rules once. Run them everywhere. One Markdown rule set compiled into the native format of seven coding agents.
repo_url: https://github.com/deuriib/agency-rules
repo_name: deuriib/agency-rules
edit_uri: edit/main/docs/
copyright: MIT © Deuri Vasquez

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started:
      - Installation and first run: getting-started.md
      - CLI reference: cli.md
      - Harness reference: reference/harnesses.md
  - Rule library: rules/index.md
  - Concepts:
      - Architecture: ARCHITECTURE.md
      - Rule specification: RULE-SPEC.md
  - Guides:
      - Adding a harness: ADDING-A-HARNESS.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Releasing: RELEASING.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Changelog: changelog.md
  - DX evidence:
      - Baseline: dx/BASELINE.md
      - Decisions: dx/DECISIONS.md
      - Scorecard: dx/SCORECARD.md

# Rule pages are generated and linked from the library index. They are reachable
# through search and the index table; listing 51 rules in the sidebar would bury
# the navigation that matters.
not_in_nav: |
  rules/*.md

plugins:
  - search

hooks:
  - hooks/generated_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deuriib/agency-rules
      name: agency-rules on GitHub

extra_css:
  - stylesheets/extra.css
