[tools]
node = "22"
"npm:@biomejs/biome" = "2.5.0" # Pinned for reproducibility

[env]
NODE_ENV = "development"
RULES_DIR = "{{config_root}}/rules"
INTEGRATIONS_DIR = "{{config_root}}/integrations"
_.path = ["./node_modules/.bin"]

# ── Setup ─────────────────────────────────────────────────────────────
[tasks.setup]
description = "Install Node dependencies"
run = "npm ci"

# ── Format & lint (Biome) ─────────────────────────────────────────────
[tasks.fmt]
description = "Format the entire codebase with Biome"
run = "biome format --write ."

[tasks.lint]
description = "Run Biome's linter (no file modifications)"
run = "biome lint ."

[tasks.check]
description = "Format, lint, and organize imports (write mode)"
run = "biome check --write ."

# Read-only twin, used by `ci`. `check` writes, so a `ci` that depended on it
# could rewrite the tree it was meant to verify: the documented Test step would
# pass while having changed the files it judged. CI runs `biome ci` for the same
# reason, and `tests/ci-parity.test.mjs` holds the two together.
[tasks."check:ci"]
description = "Verify formatting and linting without writing"
run = "biome ci"

# ── Scaffold ──────────────────────────────────────────────────────────
[tasks.create-rule]
description = "Scaffold a new rule under rules/ (e.g. mise run create-rule -- api-review)"
run = "node bin/agency-rules.mjs new"

# ── Validation ────────────────────────────────────────────────────────
[tasks.validate]
description = "Validate each rule's frontmatter against the schema"
run = "node bin/agency-rules.mjs validate"

# ── Duplication eval ──────────────────────────────────────────────────
[tasks.eval]
description = "Score textual overlap between rules (fails above the gate)"
run = "node bin/agency-rules.mjs eval"
sources = ["rules/**/*.md", "scripts/eval.mjs", "scripts/lib/overlap.mjs", "scripts/lib/contradictions.mjs", "scripts/lib/paths.mjs", "scripts/lib/cli-rules.mjs"]

# ── Conversion ────────────────────────────────────────────────────────
[tasks.convert]
description = "Compile rules/ into each harness's native format"
run = "node bin/agency-rules.mjs convert"
sources = ["rules/**/*.md", "tools.json", "scripts/convert.mjs", "scripts/lib/**/*.mjs"]
outputs = ["integrations/**/*"]

[tasks."convert:dry-run"]
description = "Preview which files convert would write (no writes)"
run = "node bin/agency-rules.mjs convert --dry-run"

# ── Install ───────────────────────────────────────────────────────────
[tasks.install]
description = "Install compiled artifacts into detected harnesses"
run = "node bin/agency-rules.mjs install"
depends = ["convert"]

[tasks."install:dry-run"]
description = "Preview which files install would copy (no writes, no convert)"
run = "node bin/agency-rules.mjs install --dry-run"

# ── Tests ─────────────────────────────────────────────────────────────
[tasks.test]
description = "Run the conversion test suite"
run = "node --test 'tests/**/*.test.mjs'"

# ── List ──────────────────────────────────────────────────────────────
[tasks.list]
description = "List all available rules"
run = "node bin/agency-rules.mjs list"

# ── CI composition ────────────────────────────────────────────────────
[tasks.ci]
description = "Full pipeline: validate → eval → check:ci → convert → test"
depends = ["validate", "eval", "check:ci", "convert", "test"]

[tasks.release]
description = "Trigger the release workflow on GitHub (requires gh CLI)"
run = "gh workflow run release.yml"

[hooks]
postinstall = "npm ci"
