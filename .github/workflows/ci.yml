name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Validate rules
        run: mise run validate

      - name: Eval rule overlap
        run: mise run eval

      - name: Check formatting and linting
        run: biome ci

      - name: Convert rules
        run: mise run convert

      - name: Run tests
        run: mise run test

      # The documented path, executed. The README tells a newcomer to run these
      # two commands, so CI runs them too: a destination in tools.json that no
      # longer resolves, or an install that writes nothing, fails here instead of
      # failing them. The installed directories are gitignored build output, so
      # this leaves the checkout a place a later step could still commit from.
      - name: Documented install path
        run: |
          mise run install --all --scope project
          mise run list --harness copilot
