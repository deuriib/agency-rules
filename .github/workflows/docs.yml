name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel a run that is mid-publish: cancelling
# a Pages deployment can leave the environment reporting the previous artifact.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          cache: true

      # Generates the rule library and reference pages, then builds in strict
      # mode: a broken internal link or a nav entry with no page fails here
      # instead of shipping a site with dead ends.
      - name: Build the documentation site
        run: mise run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
