name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Requerido para Trusted Publishing (OIDC)

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Node 24 incluye npm 11 por defecto
          # registry-url: 'https://registry.npmjs.org'  <-- ELIMINAR ESTA LÍNEA

      - name: Upgrade npm (por si acaso)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: "" # Fuerza a npm a usar OIDC
