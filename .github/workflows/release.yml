name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Requerido para Trusted Publishing (OIDC)

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    # Not gated on `release_created`: that output stays empty when the release is
    # created during a different run, and release-please can fail after the
    # release commit already landed. A gate silently skipped this job both times
    # (0.9.0, 0.10.0), so the release never reached npm. The publish step below
    # is idempotent instead, which covers every one of those cases.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Strip empty _authToken from .npmrc
        run: |
          NPMRC_PATH=$(npm config get userconfig)
          if [ -f "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi

      - name: Publish to npm unless the version already exists
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "agency-rules@${version}" version >/dev/null 2>&1; then
            echo "agency-rules@${version} is already published — nothing to do."
            exit 0
          fi
          npm publish --access public
