name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Requerido para Trusted Publishing (OIDC)

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    # Not gated on `release_created`: that output stays empty when the release is
    # created during a different run, and release-please can fail after the
    # release commit already landed. A gate silently skipped this job both times
    # (0.9.0, 0.10.0), so the release never reached npm. The publish step below
    # is idempotent instead, which covers every one of those cases.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Strip empty _authToken from .npmrc
        run: |
          NPMRC_PATH=$(npm config get userconfig)
          if [ -f "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi

      - name: Publish to npm unless the version already exists
        # Three ways this step can be a no-op, and all three are success:
        #
        #   1. The release-created output was empty because release-please opened
        #      the PR in an earlier run (0.9.0, 0.10.0). The guard below catches it.
        #   2. The version is already on npm. Same guard.
        #   3. The version is staged but the registry read has not caught up yet —
        #      `npm view` lags a publish by seconds to minutes, so a run that
        #      follows another publish of the same version passes the guard and is
        #      then rejected with E409. That rejection is the idempotent outcome.
        #
        # Case 3 made a release run red for 0.14.0. Treating the conflict as
        # success is the fix; any other publish failure still fails the job.
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")

          if npm view "agency-rules@${version}" version >/dev/null 2>&1; then
            echo "agency-rules@${version} is already published — nothing to do."
            exit 0
          fi

          # tee so the failure output is visible in the log even when the pipeline
          # is treated as success below.
          set +e
          npm publish --access public 2>&1 | tee /tmp/npm-publish.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Published agency-rules@${version}."
            exit 0
          fi

          if grep -qE 'E409|EPUBLISHCONFLICT|Cannot publish over' /tmp/npm-publish.log; then
            echo "agency-rules@${version} was already staged or published — treating as success."
            {
              echo "### npm: ${version} already staged"
              echo ''
              echo 'The registry rejected the publish as a duplicate. That is the'
              echo 'idempotent outcome, not a failure: the version was staged by an'
              echo 'earlier run. Verify with `npm view agency-rules version`.'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          echo "npm publish failed for a reason other than a duplicate version."
          exit "$status"
